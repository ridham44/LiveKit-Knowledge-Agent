# Render is used ONLY for the voice-agent worker - a long-running LiveKit process that
# cannot run as a Vercel serverless function (see voice-agent/README.md and the root
# README's "Voice Agent Worker" section). The frontend and backend API used to be
# deployed here too (as a Static Site + Web Service); they are now one Vercel project
# instead (see vercel.json at the repo root) and have been removed from this file.
#
# Render is one option for hosting this worker, not a requirement - any host that
# supports a long-running Node.js process works (Railway, Fly.io, a small VPS, etc.).
services:
  # Background Worker services are NOT available on Render's Free plan (Render restricts
  # Free to Web Services and Static Sites only) - "starter" is the cheapest tier that
  # supports this service type. There is no free way to run it on Render itself.
  - name: knowledgevoice-voice-agent
    type: worker
    runtime: node
    plan: starter
    rootDir: voice-agent
    buildCommand: npm install
    startCommand: npm start
    envVars:
      - key: LIVEKIT_URL
        sync: false
      - key: LIVEKIT_API_KEY
        sync: false
      - key: LIVEKIT_API_SECRET
        sync: false
      - key: ASSEMBLYAI_API_KEY
        sync: false
      - key: DEEPGRAM_API_KEY
        sync: false
      - key: DEEPGRAM_TTS_MODEL
        value: aura-2-luna-en
      # URL of the deployed Vercel project, e.g. https://your-app.vercel.app - no
      # trailing slash, no /api suffix (the worker appends /api/internal/... itself).
      - key: BACKEND_URL
        sync: false
      - key: AGENT_SHARED_SECRET
        sync: false

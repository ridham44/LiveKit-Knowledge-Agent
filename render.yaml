services:
  - name: knowledgevoice-backend
    type: web
    runtime: node
    plan: free
    rootDir: backend
    buildCommand: npm install
    startCommand: npm start
    healthCheckPath: /health
    # No Persistent Disk: uploaded files are only staged in the app's own ephemeral
    # filesystem for the few seconds it takes to extract their text into MongoDB, which
    # is the real persistent store (see processingService.js). UPLOAD_DIR is deliberately
    # not set here - the code's own default (./uploads, relative to the app) is fine on
    # Render Free's ephemeral disk precisely because nothing needs to survive a restart.
    envVars:
      - key: NODE_ENV
        value: production
      - key: PORT
        value: 5000
      - key: MONGODB_URI
        sync: false
      - key: JWT_SECRET
        sync: false
      - key: JWT_EXPIRE
        value: 7d
      - key: OPENROUTER_API_KEY
        sync: false
      - key: OPENROUTER_CHAT_MODEL
        value: openai/gpt-4o-mini
      - key: MAX_FILE_SIZE
        value: "52428800"
      - key: LIVEKIT_URL
        sync: false
      - key: LIVEKIT_API_KEY
        sync: false
      - key: LIVEKIT_API_SECRET
        sync: false
      # Text-to-speech for the Voice page; same key the voice-agent uses.
      - key: DEEPGRAM_API_KEY
        sync: false
      - key: FRONTEND_URL
        sync: false
      - key: AGENT_SHARED_SECRET
        sync: false

  - name: knowledgevoice-frontend
    type: web
    runtime: static
    rootDir: frontend
    buildCommand: npm install && npm run build
    staticPublishPath: dist
    routes:
      - source: /*
        destination: /index.html
    envVars:
      - key: VITE_API_URL
        sync: false
      - key: VITE_LIVEKIT_URL
        sync: false

  # Background Worker services are NOT available on Render's Free plan (Render restricts
  # Free to Web Services and Static Sites only) - this is the one component of this
  # project that requires a paid Render plan. "starter" is the cheapest tier that
  # supports this service type; there is no free way to run it on Render itself.
  - name: knowledgevoice-voice-agent
    type: worker
    runtime: node
    plan: starter
    rootDir: voice-agent
    buildCommand: npm install
    startCommand: npm start
    envVars:
      - key: LIVEKIT_URL
        sync: false
      - key: LIVEKIT_API_KEY
        sync: false
      - key: LIVEKIT_API_SECRET
        sync: false
      - key: ASSEMBLYAI_API_KEY
        sync: false
      - key: DEEPGRAM_API_KEY
        sync: false
      - key: DEEPGRAM_TTS_MODEL
        value: aura-2-luna-en
      - key: BACKEND_URL
        sync: false
      - key: AGENT_SHARED_SECRET
        sync: false
